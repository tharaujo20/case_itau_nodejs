<h2>Saque em Conta</h2>

<form (ngSubmit)="withdraw()" #form="ngForm" class="client-form">
  <label for="id">ID (UUID):</label>
  <input type="text" id="id" [(ngModel)]="id" name="id" required />

  <label for="amount">Valor do Saque:</label>
  <input
    type="number"
    id="amount"
    [(ngModel)]="amount"
    name="amount"
    required
    min="1"
  />

  <label for="password">Senha (4 dígitos):</label>
  <input
    type="number"
    id="password"
    [(ngModel)]="password"
    name="password"
    required
    minlength="4"
    maxlength="4"
  />

  <button type="submit" [disabled]="loading">Sacar</button>
</form>

<div *ngIf="loading">Processando saque...</div>

<div *ngIf="message" class="success">
  {{ message }}
  <div *ngIf="newBalance !== null">
    Saldo atualizado: <strong>{{ newBalance | currency:'BRL' }}</strong>
  </div>
</div>

<div *ngIf="errorMessage" class="error">
  {{ errorMessage }}
</div>
