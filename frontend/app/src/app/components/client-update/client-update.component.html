<h2>Atualizar Cliente</h2>

<form (ngSubmit)="updateClient()" #form="ngForm" class="client-form">
  <label for="id">ID (UUID):</label>
  <input type="text" id="id" [(ngModel)]="id" name="id" required />

  <label for="name">Novo Nome (opcional):</label>
  <input type="text" id="name" [(ngModel)]="name" name="name" />

  <label for="email">Novo E-mail (opcional):</label>
  <input type="email" id="email" [(ngModel)]="email" name="email" />

  <label for="password">Nova Senha (4 dígitos, opcional):</label>
  <input
    type="password"
    id="password"
    [(ngModel)]="password"
    name="password"
    maxlength="4"
  />

  <button type="submit" [disabled]="loading">Atualizar Cliente</button>
</form>

<div *ngIf="loading">Enviando...</div>

<div *ngIf="message" class="success">
  {{ message }}
</div>

<div *ngIf="errorMessage" class="error">
  {{ errorMessage }}
</div>
