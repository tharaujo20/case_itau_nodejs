<h2>Criar Novo Cliente</h2>

<form (ngSubmit)="createClient()" #form="ngForm" class="client-form">
  <label for="name">Nome:</label>
  <input type="text" id="name" [(ngModel)]="name" name="name" required />

  <label for="email">E-mail:</label>
  <input type="email" id="email" [(ngModel)]="email" name="email" required />

  <label for="password">Senha (4 dígitos):</label>
  <input
    type="password"
    id="password"
    [(ngModel)]="password"
    name="password"
    maxlength="4"
    required
  />

  <label for="balance">Saldo inicial (opcional):</label>
  <input type="number" id="balance" [(ngModel)]="balance" name="balance" />

  <button type="submit" [disabled]="loading">Criar Cliente</button>
</form>

<div *ngIf="loading">Enviando...</div>

<div *ngIf="message" class="success">
  {{ message }}
</div>

<div *ngIf="errorMessage" class="error">
  {{ errorMessage }}
</div>
